# tmux configuration for Linux. ~/.tmux.conf loads this file.

# Dark blue status bar with light blue text, so that the workspace looks different from the Mac
set -g status-style "bg=colour18,fg=colour153"

# Send copied text to the local clipboard with OSC 52 (a terminal code that works over SSH and mosh)
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# Map 'y' to copy the visible selection to the local clipboard
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
