# tmux configuration for macOS. ~/.tmux.conf loads this file.

# iTerm2-specific overrides for better emoji/unicode support
set -ga terminal-overrides ',xterm-256color:RGB'
set -as terminal-features ',xterm-256color:clipboard'

# Accept OSC 52 from programs in a pane, for example the workspace tmux over SSH or mosh, and send it to iTerm2
set -s set-clipboard on

# Map 'y' to copy the visible selection to the system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy" # Use "xclip -selection clipboard" for Linux

# Nested tmux: the workspace tmux runs inside this tmux, and both use the prefix C-j.
# Press F12 to turn this tmux off. Then all keys go to the program in the pane, for example the workspace tmux.
# The status bar goes grey and shows OFF. Press F12 again to turn this tmux on.
bind-key -T root F12 \
  set-option prefix None \; \
  set-option key-table off \; \
  set-option status-style "fg=colour245,bg=colour238" \; \
  if-shell -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
  refresh-client -S
bind-key -T off F12 \
  set-option -u prefix \; \
  set-option -u key-table \; \
  set-option -u status-style \; \
  refresh-client -S
set -g status-right "#{?#{==:#{client_key_table},off},#[reverse] OFF #[noreverse] ,}[#S]"
set -g status-right-length 20
