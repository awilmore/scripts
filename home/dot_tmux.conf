# Use vi
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key ESCAPE copy-mode
bind-key y      copy-mode
#bind-key -t vi-copy 'v' begin-selection
#bind-key -t vi-copy 'y' copy-selection
bind-key p paste-buffer

# choose-tree
bind-key s choose-tree -s

# Default config
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Enable emoji and unicode support
set -gq allow-passthrough on
setw -gq utf8 on

# Switch command key to CTRL-J
unbind C-b
set -g prefix C-j

# Split the pane. The new pane opens in the folder of the old pane.
# The new pane also gets a copy of the label of the old pane as its @plabel: the @plabel, else the pane title if it is
# not the host name (the Claude Code topic). The session option @split_label holds the value during the split.
unbind-key \\ ; bind-key \\ set-option -F @split_label '#{?#{@plabel},#{@plabel},#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},}}' \; split-window -h -c "#{pane_current_path}" \; set-option -p -F @plabel '#{@split_label}'
unbind-key - ; bind-key - set-option -F @split_label '#{?#{@plabel},#{@plabel},#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},}}' \; split-window -v -c "#{pane_current_path}" \; set-option -p -F @plabel '#{@split_label}'

# Pane: Vim Style Movements
bind-key -r h select-pane -L              # go left
bind-key -r j select-pane -D              # go down
bind-key -r l select-pane -R              # go right
bind-key -r k select-pane -U              # go up

# Pane: Arrow Movements
bind-key Up select-pane -U
bind-key Down select-pane -D
bind-key Left select-pane -L
bind-key Right select-pane -R

# Pane: Movements
bind-key -r C-h select-pane -t :.+
bind-key -r C-j select-pane -t :.+

# To get things like open * working on Mac
#set-option -g default-command "which reattach-to-user-namespace > /dev/null && reattach-to-user-namespace -l $SHELL || $SHELL"

# Bigger history
set -g history-limit 10000

# New windows/pane in $PWD
bind c new-window -c '#{pane_current_path}'

# Use mouse for switching (breaks cut-n-paste!)
#setw -g mode-mouse on
#set-option -g mouse-select-pane on
set -g mouse on

# Don't exit copy mode when dragging with mouse
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection

# Reload tmux.conf
unbind-key C-r ; bind-key C-r source-file ~/.tmux.conf \; display-message "Configuration reloaded"

# Switch status left and right
set -g status-right "#{?#{@label},#{@label} ,}[#S]"
set -g status-right-length 40

set -g status-left-length 70
set -g status-left "#[fg=red]#h : "

# Labels. The session option @label holds a manual label. The shell command `label` sets it.
# Send a title to the terminal tab: the manual label, else the titles of the panes that are not the host name
# (Claude Code writes its topic there), else the folder name of the active pane.
set -g set-titles on
set -g set-titles-string '#{?#{@label},#{@label},#{?#{P:#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},}},#{P:#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},}},#{b:pane_current_path}}}'

# Show a title on the right of the top border of each pane: the pane option @plabel (the shell command `plabel` sets it),
# else the pane title if it is not the host name, else the folder name.
set -g pane-border-status top
set -g pane-border-format '#[align=right] #{?#{@plabel},#{@plabel},#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},#{pane_title},#{b:pane_current_path}}} '

# Press prefix then L to set the label. Give an empty label to remove it.
bind-key L command-prompt -p "label:" "if-shell -F '%%' \"set-option @label '%%'\" \"set-option -u @label\""


# Load the part for this OS: ~/.tmux.darwin.conf or ~/.tmux.linux.conf
if-shell 'test "$(uname -s)" = Darwin' 'source-file ~/.tmux.darwin.conf' 'source-file ~/.tmux.linux.conf'
